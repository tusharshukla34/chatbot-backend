<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Course Compass — Cybrom Course Advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --navy: #16213E;
      --navy-light: #24345C;
      --paper: #F4F0E8;
      --card: #FFFFFF;
      --marigold: #EFA23D;
      --marigold-dark: #D68A26;
      --sage: #6B8F71;
      --text: #22252B;
      --muted: #767b86;
      --border: #E7E1D3;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      background-image:
        radial-gradient(circle at 1px 1px, rgba(22, 33, 62, 0.07) 1px, transparent 0);
      background-size: 22px 22px;
      margin: 0;
      padding: 20px 12px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-widget {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(22, 33, 62, 0.06), 0 20px 48px -12px rgba(22, 33, 62, 0.28);
      display: flex;
      flex-direction: column;
      height: 660px;
      max-height: 92vh;
      overflow: hidden;
      border: 1px solid rgba(22, 33, 62, 0.08);
      position: relative;
    }

    /* ---------- header ---------- */
    .chat-header {
      background: var(--navy);
      background-image: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      color: #fff;
      padding: 16px 20px 14px;
      position: relative;
      flex-shrink: 0;
    }

    .chat-header-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .compass-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .chat-header h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 18px;
      margin: 0;
      letter-spacing: 0.01em;
    }

    .chat-header .sub {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 1px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* ---------- progress stepper ---------- */
    .stepper {
      display: flex;
      align-items: center;
      margin-top: 14px;
      padding: 0 4px;
    }

    .step-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      transition: all 0.35s ease;
      flex-shrink: 0;
    }

    .step-dot.done {
      background: var(--sage);
    }

    .step-dot.active {
      background: var(--marigold);
      box-shadow: 0 0 0 4px rgba(239, 162, 61, 0.3);
      transform: scale(1.15);
    }

    .step-line {
      flex: 1;
      height: 2px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 6px;
      position: relative;
      overflow: hidden;
      border-radius: 2px;
    }

    .step-line-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: var(--sage);
      transition: width 0.4s ease;
    }

    .step-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 9.5px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0 2px;
    }

    /* ---------- cold start alert ---------- */
    .server-notice {
      display: none;
      background: #FFF8E7;
      border-bottom: 1px solid #F2DFB8;
      color: #8C5808;
      font-size: 11.5px;
      font-weight: 500;
      padding: 7px 16px;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      animation: riseIn 0.3s ease both;
    }

    .server-notice.show {
      display: flex;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(140, 88, 8, 0.25);
      border-top-color: #8C5808;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- messages ---------- */
    .chat-messages {
      flex: 1;
      padding: 16px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #ddd6c5;
      border-radius: 3px;
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg {
      max-width: 84%;
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.48;
      white-space: pre-wrap;
      animation: riseIn 0.3s ease both;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--marigold);
      color: #2b1c04;
      font-weight: 500;
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: #F1EEE5;
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg.error-msg {
      background: #FDEDEC;
      color: #922B21;
      border-left: 3px solid #E74C3C;
    }

    /* ---------- course cards ---------- */
    .course-card {
      align-self: flex-start;
      width: 100%;
      max-width: 96%;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--navy);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(22, 33, 62, 0.06);
      animation: riseIn 0.35s ease both;
      position: relative;
    }

    .course-card .badge {
      display: inline-block;
      background: rgba(22, 33, 62, 0.08);
      color: var(--navy);
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .course-card h4 {
      font-family: 'Fraunces', serif;
      margin: 0 0 4px 0;
      font-size: 15.5px;
      color: var(--navy);
      font-weight: 600;
    }

    .course-card .meta {
      color: var(--muted);
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 500;
    }

    .module-list {
      margin: 6px 0 0 0;
      padding-left: 18px;
      font-size: 12.5px;
      color: var(--text);
    }

    .module-list li {
      margin-bottom: 3px;
    }

    .more-note {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 4px;
      font-style: italic;
    }

    .primary-cta-btn {
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 12px;
      background: var(--navy);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .primary-cta-btn:hover {
      background: var(--marigold-dark);
      transform: translateY(-1px);
    }

    /* ---------- quick replies ---------- */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-self: flex-start;
      max-width: 96%;
      animation: riseIn 0.3s ease both;
    }

    .qr-btn {
      background: #fff;
      border: 1.5px solid var(--navy);
      color: var(--navy);
      border-radius: 20px;
      padding: 7px 13px;
      font-size: 12.5px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .qr-btn:hover,
    .qr-btn:focus-visible {
      background: var(--navy);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(22, 33, 62, 0.2);
      outline: none;
    }

    .qr-btn.ghost {
      border-style: dashed;
      border-color: var(--muted);
      color: var(--muted);
      font-weight: 500;
    }

    .qr-btn.ghost:hover,
    .qr-btn.ghost:focus-visible {
      background: var(--muted);
      border-color: var(--muted);
      color: #fff;
    }

    /* ---------- typing indicator ---------- */
    .typing-row {
      display: none;
      align-self: flex-start;
      align-items: center;
      gap: 4px;
      padding: 10px 15px;
      background: #F1EEE5;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }

    .typing-row.show {
      display: flex;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }
      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* ---------- input ---------- */
    .chat-input {
      display: flex;
      border-top: 1px solid var(--border);
      padding: 12px;
      gap: 8px;
      background: var(--card);
      flex-shrink: 0;
    }

    .chat-input input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 22px;
      padding: 11px 16px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .chat-input input:focus {
      border-color: var(--marigold);
    }

    .chat-input button {
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 22px;
      padding: 0 20px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .chat-input button:hover,
    .chat-input button:focus-visible {
      background: var(--navy-light);
      outline: none;
    }

    .chat-input button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .retry-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 12px;
      background: #C0392B;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
      }
      .chat-widget {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        border: none;
      }
    }
  </style>
</head>

<body>

  <main class="chat-widget" role="region" aria-label="Course Advisor Chatbot">
    <header class="chat-header">
      <div class="chat-header-top">
        <svg class="compass-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="13" stroke="#EFA23D" stroke-width="2" />
          <path d="M21 11L17.5 17.5L11 21L14.5 14.5L21 11Z" fill="#EFA23D" />
          <circle cx="16" cy="16" r="1.6" fill="#16213E" />
        </svg>
        <div>
          <h1>Course Compass</h1>
          <div class="sub">Find your tech career path, one step at a time</div>
        </div>
      </div>
      <div class="stepper" aria-label="Progress Stepper">
        <div class="step-dot active" id="dot-1" title="Step 1: Level"></div>
        <div class="step-line"><div class="step-line-fill" id="line-1"></div></div>
        <div class="step-dot" id="dot-2" title="Step 2: Interest"></div>
        <div class="step-line"><div class="step-line-fill" id="line-2"></div></div>
        <div class="step-dot" id="dot-3" title="Step 3: Track"></div>
        <div class="step-line"><div class="step-line-fill" id="line-3"></div></div>
        <div class="step-dot" id="dot-4" title="Step 4: Matches"></div>
      </div>
      <div class="step-labels">
        <span>Level</span><span>Interest</span><span>Track</span><span>Matches</span>
      </div>
    </header>

    <div id="serverNotice" class="server-notice" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>Connecting to cloud server (waking up, please wait a moment)...</span>
    </div>

    <div class="chat-messages" id="messages" role="log" aria-live="polite"></div>

    <div class="typing-row" id="typing" aria-label="Assistant is typing">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>

    <form class="chat-input" id="chatForm" onsubmit="event.preventDefault(); sendMessage();">
      <input type="text" id="userInput" placeholder="Type a message..." aria-label="Type your message" autocomplete="off" />
      <button type="submit" id="sendBtn" aria-label="Send">Send</button>
    </form>
  </main>

  <script>
    // Detect backend URL (default to Render live, or fallback to current origin if served from local)
    const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const API_BASE = isLocal ? window.location.origin : "https://chatbot-backend-a3kk.onrender.com";
    const API_URL = `${API_BASE}/chat`;
    const MARK_INTEREST_URL = `${API_BASE}/mark-interest`;

    // Persist session ID in sessionStorage so refresh maintains conversation
    let sessionId = sessionStorage.getItem("cybrom_session_id");
    if (!sessionId) {
      sessionId = "web_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      sessionStorage.setItem("cybrom_session_id", sessionId);
    }

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const typingEl = document.getElementById("typing");
    const serverNotice = document.getElementById("serverNotice");

    let currentStep = 1;
    let wakeTimer = null;

    function setStep(step) {
      if (typeof step !== "number" || step < 1 || step > 4) return;
      currentStep = step;
      for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById("dot-" + i);
        if (!dot) continue;
        dot.classList.remove("active", "done");
        if (i < step) dot.classList.add("done");
        else if (i === step) dot.classList.add("active");
      }
      for (let i = 1; i <= 3; i++) {
        const line = document.getElementById("line-" + i);
        if (line) {
          line.style.width = (i < step ? "100%" : "0%");
        }
      }
    }

    function addMessage(text, sender, isError = false) {
      const div = document.createElement("div");
      div.className = "msg " + sender + (isError ? " error-msg" : "");
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addCourseCards(courses) {
      courses.forEach(c => {
        const card = document.createElement("div");
        card.className = "course-card";
        card.setAttribute("role", "article");

        const modulesHtml = (c.modules_preview || [])
          .map(m => `<li>${m}</li>`)
          .join("");
        const hasMore = (c.total_modules || 0) > (c.modules_preview || []).length;

        card.innerHTML = `
          <div class="badge">${c.mode || "Online / Offline"}</div>
          <h4>${c.title || ""}</h4>
          <div class="meta">⏱ Duration: ${c.duration || "Contact us"}</div>
          ${modulesHtml ? `<ul class="module-list">${modulesHtml}</ul>` : ""}
          ${hasMore ? `<div class="more-note">+ ${(c.total_modules - (c.modules_preview || []).length)} more modules</div>` : ""}
          <a href="${c.link || '#'}" class="primary-cta-btn" data-title="${c.title || ''}" target="_blank" rel="noopener">
            View Syllabus & Apply →
          </a>
        `;
        messagesEl.appendChild(card);

        const linkEl = card.querySelector(".primary-cta-btn");
        linkEl.addEventListener("click", () => {
          fetch(MARK_INTEREST_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId, course_title: c.title }),
            keepalive: true
          }).catch(err => console.warn("mark-interest failed:", err));
        });
      });
      scrollToBottom();
    }

    function addQuickReplies(options) {
      const wrap = document.createElement("div");
      wrap.className = "quick-replies";

      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = opt;
        btn.className = "qr-btn" + (opt === "Something else" ? " ghost" : "");
        btn.addEventListener("click", () => {
          wrap.remove();
          if (opt === "Something else") {
            inputEl.focus();
            return;
          }
          addMessage(opt, "user");
          sendToBackend(opt);
        });
        wrap.appendChild(btn);
      });
      messagesEl.appendChild(wrap);
      scrollToBottom();
    }

    async function sendToBackend(text, retryCount = 0) {
      sendBtn.disabled = true;
      typingEl.classList.add("show");
      scrollToBottom();

      // Show waking up notice if request takes more than 4 seconds
      clearTimeout(wakeTimer);
      wakeTimer = setTimeout(() => {
        serverNotice.classList.add("show");
      }, 4000);

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 40000);

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        clearTimeout(wakeTimer);
        serverNotice.classList.remove("show");

        if (!res.ok) {
          throw new Error(`Server returned HTTP ${res.status}`);
        }

        const data = await res.json();
        addMessage(data.reply, "bot");

        // Dynamically drive the stepper from backend step
        if (typeof data.step === "number") {
          setStep(data.step);
        }

        if (data.suggested_courses && data.suggested_courses.length > 0) {
          addCourseCards(data.suggested_courses);
        }
        if (data.quick_replies && data.quick_replies.length > 0) {
          addQuickReplies(data.quick_replies);
        }
      } catch (err) {
        clearTimeout(timeoutId);
        clearTimeout(wakeTimer);
        serverNotice.classList.remove("show");
        console.error("Backend error:", err);

        const errorDiv = addMessage(
          "Cloud server wake-up is taking a little longer than usual. Tap below to retry connecting.",
          "bot",
          true
        );
        const retryBtn = document.createElement("button");
        retryBtn.className = "retry-btn";
        retryBtn.textContent = "🔄 Retry";
        retryBtn.onclick = () => {
          errorDiv.remove();
          sendToBackend(text, retryCount + 1);
        };
        errorDiv.appendChild(document.createElement("br"));
        errorDiv.appendChild(retryBtn);
      } finally {
        sendBtn.disabled = false;
        typingEl.classList.remove("show");
        inputEl.focus();
      }
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      addMessage(text, "user");
      inputEl.value = "";
      sendToBackend(text);
    }

    // Initial greeting
    addMessage("Hello! How can I assist you with your tech courses today?", "bot");
  </script>

</body>

</html>
