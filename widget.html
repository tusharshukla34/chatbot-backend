<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Cybrom AI Course Compass — Next-Gen Tech Advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #F8FAFC;
      --panel-bg: rgba(255, 255, 255, 0.95);
      --panel-border: rgba(226, 232, 240, 0.9);
      --primary: #4F46E5;
      --primary-light: #6366F1;
      --primary-subtle: #EEF2FF;
      --accent-purple: #7C3AED;
      --text-main: #0F172A;
      --text-body: #1E293B;
      --text-muted: #64748B;
      --text-dim: #94A3B8;
      --bot-bg: #F8FAFC;
      --bot-border: #E2E8F0;
      --user-gradient: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      --emerald: #10B981;
      --emerald-bg: #ECFDF5;
      --card-bg: #FFFFFF;
      --card-border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 14px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient animated pastel glow orbs for light mode */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: floatGlow 14s ease-in-out infinite alternate;
    }

    .glow-1 {
      top: -10%;
      left: 10%;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.16) 0%, rgba(99, 102, 241, 0) 70%);
      animation-duration: 12s;
    }

    .glow-2 {
      bottom: -15%;
      right: 10%;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, rgba(14, 165, 233, 0) 70%);
      animation-duration: 16s;
    }

    .glow-3 {
      top: 35%;
      right: 25%;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, rgba(236, 72, 153, 0) 70%);
      animation-duration: 11s;
    }

    @keyframes floatGlow {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(30px, -30px) scale(1.06);
      }

      100% {
        transform: translate(-25px, 25px) scale(0.95);
      }
    }

    /* Main chat container */
    .chat-widget {
      width: 100%;
      max-width: 470px;
      height: 730px;
      max-height: 94vh;
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--panel-border);
      border-radius: 26px;
      box-shadow:
        0 20px 50px -12px rgba(15, 23, 42, 0.12),
        0 0 0 1px rgba(0, 0, 0, 0.04),
        0 4px 20px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 10;
      animation: containerEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes containerEntrance {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(16px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Header */
    .chat-header {
      background: #FFFFFF;
      padding: 16px 20px 14px;
      border-bottom: 1px solid #E2E8F0;
      flex-shrink: 0;
      position: relative;
    }

    .chat-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-branding {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrapper {
      position: relative;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    .avatar-icon {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      background: var(--user-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
      position: relative;
      z-index: 2;
      transition: transform 0.3s ease;
    }

    .avatar-wrapper:hover .avatar-icon {
      transform: scale(1.05) rotate(4deg);
    }

    .header-titles h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    .header-titles .tagline {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 1px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--emerald-bg);
      border: 1px solid #A7F3D0;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 600;
      color: #059669;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--emerald);
      border-radius: 50%;
      position: relative;
    }

    .pulse-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--emerald);
      opacity: 0.6;
      animation: ripple 1.8s ease-out infinite;
    }

    @keyframes ripple {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }

      100% {
        transform: scale(2.6);
        opacity: 0;
      }
    }

    .reset-btn {
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .reset-btn:hover {
      background: #E2E8F0;
      color: var(--text-main);
      transform: rotate(180deg);
    }

    /* Stepper */
    .stepper-container {
      margin-top: 14px;
      padding: 0 4px;
    }

    .stepper {
      display: flex;
      align-items: center;
      position: relative;
    }

    .step-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #F1F5F9;
      border: 2px solid #CBD5E1;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 800;
      color: transparent;
    }

    .step-dot.done {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #fff;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }

    .step-dot.done::after {
      content: '✓';
    }

    .step-dot.active {
      background: var(--user-gradient);
      border-color: #fff;
      transform: scale(1.3);
      box-shadow: 0 0 14px rgba(79, 70, 229, 0.5);
    }

    .step-line {
      flex: 1;
      height: 3px;
      background: #E2E8F0;
      margin: 0 6px;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .step-line-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #10B981, #4F46E5);
      transition: width 0.45s ease;
    }

    .step-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 9.5px;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0 2px;
    }

    .step-labels span.active-label {
      color: var(--primary);
    }

    /* Server cold-start notice */
    .server-notice {
      display: none;
      background: #FFFBEB;
      border-bottom: 1px solid #FDE68A;
      color: #B45309;
      font-size: 11.5px;
      font-weight: 600;
      padding: 8px 16px;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      animation: slideDown 0.3s ease both;
    }

    .server-notice.show {
      display: flex;
    }

    .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid rgba(180, 83, 9, 0.25);
      border-top-color: #B45309;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Message list */
    .chat-messages {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 10px;
    }

    /* Message bubbles */
    .msg-group {
      display: flex;
      flex-direction: column;
      max-width: 86%;
      animation: msgPop 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .msg-group.user-group {
      align-self: flex-end;
    }

    .msg-group.bot-group {
      align-self: flex-start;
    }

    @keyframes msgPop {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.96);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .msg-sender-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 4px;
      margin-left: 6px;
      letter-spacing: 0.03em;
    }

    .msg {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 13.5px;
      line-height: 1.55;
      word-break: break-word;
      position: relative;
    }

    .msg.user {
      background: var(--user-gradient);
      color: #fff;
      font-weight: 500;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
    }

    .msg.bot {
      background: var(--bot-bg);
      border: 1px solid var(--bot-border);
      color: var(--text-body);
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .msg.error-msg {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #B91C1C;
      border-left: 4px solid #EF4444;
    }

    .bot-strong {
      color: #312E81;
      font-weight: 700;
    }

    /* ---------- HORIZONTAL SCROLLING COURSE CAROUSEL ---------- */
    .carousel-wrapper {
      width: 100%;
      align-self: flex-start;
      margin: 4px 0 8px 0;
      animation: msgPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .carousel-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding-left: 2px;
    }

    .carousel-hint svg {
      width: 13px;
      height: 13px;
      stroke: var(--primary);
    }

    .course-carousel {
      display: flex;
      flex-direction: row;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 4px 4px 16px 4px;
      scrollbar-width: thin;
    }

    .course-carousel::-webkit-scrollbar {
      height: 6px;
    }

    .course-carousel::-webkit-scrollbar-track {
      background: #F1F5F9;
      border-radius: 4px;
    }

    .course-carousel::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }

    .course-carousel::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    .course-card {
      width: 275px;
      min-width: 275px;
      max-width: 275px;
      flex-shrink: 0;
      scroll-snap-align: start;
      background: #FFFFFF;
      border: 1.5px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .course-card:hover {
      transform: translateY(-3px);
      border-color: #C7D2FE;
      box-shadow: 0 10px 24px rgba(79, 70, 229, 0.12);
    }

    .course-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3.5px;
      background: var(--user-gradient);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .course-card .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--primary-subtle);
      color: #4338CA;
      border: 1px solid #C7D2FE;
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .course-card h4 {
      font-family: 'Outfit', sans-serif;
      margin: 2px 0 6px 0;
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
    }

    .course-card .meta {
      color: var(--text-muted);
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .module-list {
      margin: 8px 0 4px 0;
      padding-left: 18px;
      font-size: 12px;
      color: #334155;
      line-height: 1.55;
      flex-grow: 1;
    }

    .module-list li {
      margin-bottom: 3px;
    }

    .more-note {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 5px;
      margin-bottom: 8px;
      font-style: italic;
    }

    .primary-cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      text-align: center;
      margin-top: auto;
      background: var(--user-gradient);
      color: #fff;
      font-size: 12.5px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 11px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.28);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .primary-cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }

    /* Quick replies */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-self: flex-start;
      max-width: 98%;
      animation: msgPop 0.35s ease both;
    }

    .qr-btn {
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      color: var(--text-body);
      border-radius: 22px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 600;
      font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .qr-btn:hover {
      background: var(--primary-subtle);
      border-color: var(--primary-light);
      color: #312E81;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.15);
    }

    .qr-btn:active {
      transform: scale(0.97);
    }

    .qr-btn.ghost {
      border-style: dashed;
      border-color: #CBD5E1;
      color: var(--text-muted);
      background: transparent;
    }

    .qr-btn.ghost:hover {
      border-color: var(--text-body);
      color: var(--text-main);
      background: #F1F5F9;
    }

    /* Typing indicator */
    .typing-row {
      display: none;
      align-self: flex-start;
      align-items: center;
      gap: 5px;
      padding: 10px 16px;
      background: var(--bot-bg);
      border: 1px solid var(--bot-border);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .typing-row.show {
      display: flex;
    }

    .typing-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      animation: waveBounce 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    .typing-dot:nth-child(4) {
      animation-delay: 0.45s;
    }

    @keyframes waveBounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
        box-shadow: 0 0 6px var(--primary-light);
      }
    }

    /* Input area */
    .chat-input {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 10px;
      background: #FFFFFF;
      border-top: 1px solid #E2E8F0;
      flex-shrink: 0;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .chat-input input {
      width: 100%;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 24px;
      padding: 12px 18px;
      font-size: 13.5px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .chat-input input::placeholder {
      color: var(--text-dim);
    }

    .chat-input input:focus {
      border-color: var(--primary);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--user-gradient);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s ease;
    }

    .send-btn:hover:not(:disabled) {
      transform: scale(1.06);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.45);
    }

    .send-btn:hover:not(:disabled) svg {
      transform: translateX(2px) translateY(-1px);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 6px 14px;
      background: #DC2626;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(220, 38, 38, 0.25);
      transition: all 0.2s ease;
    }

    .retry-btn:hover {
      transform: translateY(-1px);
    }

    /* ========================================================
       EASTER EGG PRANK: ROGUE BUTTON & HERO AVATAR ANIMATIONS
       ======================================================== */
    .send-btn-ghost {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .send-btn.rogue-mode {
      position: absolute !important;
      z-index: 9999 !important;
      cursor: grab !important;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.7), 0 0 20px rgba(129, 140, 248, 0.8) !important;
      transition: left 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.28),
                  top 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.28),
                  transform 0.2s ease !important;
      animation: rogueJiggle 0.35s infinite alternate ease-in-out;
    }

    @keyframes rogueJiggle {
      0% { transform: rotate(-10deg) scale(1.08); }
      100% { transform: rotate(10deg) scale(1.16); }
    }

    .send-btn.rogue-hit {
      animation: rogueHitSpin 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
      background: linear-gradient(135deg, #EF4444 0%, #B91C1C 100%) !important;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.9) !important;
    }

    @keyframes rogueHitSpin {
      0% { transform: scale(1.5) rotate(0deg); filter: brightness(2.2); }
      50% { transform: scale(0.85) rotate(540deg); }
      100% { transform: scale(1) rotate(1080deg); filter: brightness(1); }
    }

    .rogue-taunt {
      position: absolute;
      background: #1E1B4B;
      color: #F8FAFC;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 10px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10000;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      animation: tauntFade 0.85s forwards ease-out;
    }

    @keyframes tauntFade {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      20% { opacity: 1; transform: translateY(-8px) scale(1); }
      75% { opacity: 1; transform: translateY(-16px) scale(1); }
      100% { opacity: 0; transform: translateY(-24px) scale(0.9); }
    }

    .hero-avatar-wrap {
      position: absolute;
      z-index: 9998;
      width: 72px;
      height: 90px;
      cursor: pointer;
      user-select: none;
      transition: left 1s cubic-bezier(0.25, 1, 0.5, 1),
                  top 1s cubic-bezier(0.25, 1, 0.5, 1),
                  bottom 1s cubic-bezier(0.25, 1, 0.5, 1),
                  right 1s cubic-bezier(0.25, 1, 0.5, 1),
                  transform 0.4s ease;
      filter: drop-shadow(0 8px 18px rgba(15, 23, 42, 0.3));
    }

    .hero-avatar-wrap.peeking {
      animation: avatarPeekIn 0.65s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    @keyframes avatarPeekIn {
      0% { transform: translate(65px, 45px) rotate(22deg); opacity: 0; }
      70% { transform: translate(-5px, -5px) rotate(-6deg); opacity: 1; }
      100% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    }

    .hero-avatar-wrap.walking {
      animation: avatarWalkBob 0.32s infinite alternate ease-in-out;
    }

    @keyframes avatarWalkBob {
      0% { transform: translateY(0) rotate(-4deg); }
      100% { transform: translateY(-7px) rotate(4deg); }
    }

    .avatar-bubble {
      position: absolute;
      bottom: 86px;
      right: -10px;
      background: linear-gradient(135deg, #1E1B4B 0%, #312E81 100%);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      padding: 7px 12px;
      border-radius: 12px;
      border-bottom-right-radius: 3px;
      box-shadow: 0 6px 18px rgba(30, 27, 75, 0.38), 0 0 0 1px rgba(255, 255, 255, 0.15);
      white-space: nowrap;
      pointer-events: none;
      animation: bubblePop 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      z-index: 10001;
    }

    .avatar-bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      right: 16px;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #312E81;
    }

    @keyframes bubblePop {
      0% { opacity: 0; transform: scale(0.6) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .avatar-gun-arm {
      transform-origin: 48px 36px;
      transition: transform 0.25s ease-out;
    }

    .laser-bullet {
      position: absolute;
      width: 16px;
      height: 5px;
      background: #F43F5E;
      box-shadow: 0 0 10px #F43F5E, 0 0 20px #FB7185, 0 0 4px #FFFFFF;
      border-radius: 3px;
      z-index: 10000;
      pointer-events: none;
      transition: left 0.18s linear, top 0.18s linear;
    }

    .impact-explosion {
      position: absolute;
      font-size: 28px;
      transform: translate(-50%, -50%) scale(0.5);
      animation: explodeBurst 0.55s ease-out forwards;
      z-index: 10001;
      pointer-events: none;
    }

    @keyframes explodeBurst {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; filter: drop-shadow(0 0 14px #EF4444); }
      50% { transform: translate(-50%, -50%) scale(1.7); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.3); opacity: 0; }
    }

    .dizzy-stars {
      position: absolute;
      font-size: 20px;
      pointer-events: none;
      animation: dizzySpin 0.75s infinite linear;
      z-index: 10000;
    }

    @keyframes dizzySpin {
      0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.9); }
      100% { transform: translate(-50%, -50%) rotate(360deg) scale(1.15); }
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        background: #FFFFFF;
      }

      .chat-widget {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        border: none;
        max-width: 100%;
        box-shadow: none;
      }

      .ambient-glow {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <main class="chat-widget" role="region" aria-label="Course Advisor Chatbot">
    <header class="chat-header">
      <div class="chat-header-top">
        <div class="header-branding">
          <div class="avatar-wrapper">
            <div class="avatar-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
              </svg>
            </div>
          </div>
          <div class="header-titles">
            <h1>Cybrom AI</h1>
            <div class="tagline">
              <span>Your Personal Tech Counselor</span>
              <span class="status-badge"><span class="pulse-dot"></span> Online</span>
            </div>
          </div>
        </div>

        <button type="button" class="reset-btn" id="resetBtn" title="Start New Conversation" aria-label="Restart chat">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M3 21v-5h5" />
          </svg>
        </button>
      </div>

      <!-- Animated Progress Stepper -->
      <div class="stepper-container">
        <div class="stepper" aria-label="Progress Stepper">
          <div class="step-dot active" id="dot-1" title="Step 1: Level"></div>
          <div class="step-line">
            <div class="step-line-fill" id="line-1"></div>
          </div>
          <div class="step-dot" id="dot-2" title="Step 2: Interest"></div>
          <div class="step-line">
            <div class="step-line-fill" id="line-2"></div>
          </div>
          <div class="step-dot" id="dot-3" title="Step 3: Track"></div>
          <div class="step-line">
            <div class="step-line-fill" id="line-3"></div>
          </div>
          <div class="step-dot" id="dot-4" title="Step 4: Matches"></div>
        </div>
        <div class="step-labels">
          <span id="label-1" class="active-label">Level</span>
          <span id="label-2">Interest</span>
          <span id="label-3">Track</span>
          <span id="label-4">Matches</span>
        </div>
      </div>
    </header>

    <div id="serverNotice" class="server-notice" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>Connecting to cloud server (waking up, please wait a moment)...</span>
    </div>

    <div class="chat-messages" id="messages" role="log" aria-live="polite"></div>

    <div class="typing-row" id="typing" aria-label="Assistant is typing">
      <span class="typing-label">AI is typing</span>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>

    <form class="chat-input" id="chatForm" onsubmit="handleChatSubmit(event);">
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Ask anything about courses, career..."
          aria-label="Type your message" autocomplete="off" />
      </div>
      <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </form>
  </main>

  <script>
    // Detect backend URL (default to Render live, or fallback to current origin if served from local)
    const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const API_BASE = isLocal ? window.location.origin : "https://chatbot-backend-a3kk.onrender.com";
    const API_URL = `${API_BASE}/chat`;
    const MARK_INTEREST_URL = `${API_BASE}/mark-interest`;

    // Persist session ID in sessionStorage so refresh maintains conversation
    let sessionId = sessionStorage.getItem("cybrom_session_id");
    if (!sessionId) {
      sessionId = "web_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      sessionStorage.setItem("cybrom_session_id", sessionId);
    }

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const typingEl = document.getElementById("typing");
    const serverNotice = document.getElementById("serverNotice");
    const resetBtn = document.getElementById("resetBtn");

    let currentStep = 1;
    let wakeTimer = null;

    if (resetBtn) {
      resetBtn.addEventListener("click", () => {
        if (confirm("Reset conversation and start fresh?")) {
          sessionStorage.removeItem("cybrom_session_id");
          sessionStorage.removeItem("cybrom_easter_egg_done");
          window.location.reload();
        }
      });
    }

    function setStep(step) {
      if (typeof step !== "number" || step < 1 || step > 4) return;
      currentStep = step;
      for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById("dot-" + i);
        const lbl = document.getElementById("label-" + i);
        if (!dot) continue;
        dot.classList.remove("active", "done");
        if (lbl) lbl.classList.remove("active-label");

        if (i < step) {
          dot.classList.add("done");
        } else if (i === step) {
          dot.classList.add("active");
          if (lbl) lbl.classList.add("active-label");
        }
      }
      for (let i = 1; i <= 3; i++) {
        const line = document.getElementById("line-" + i);
        if (line) {
          line.style.width = (i < step ? "100%" : "0%");
        }
      }
    }

    function formatBotText(raw) {
      if (!raw) return "";
      // Escape HTML
      let safe = raw.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      // Format markdown **bold**
      safe = safe.replace(/\*\*(.*?)\*\*/g, '<span class="bot-strong">$1</span>');
      // Format numbered lists with clean breaks
      safe = safe.replace(/(\d+\.\s+[^\n]+)/g, '<br>$1');
      return safe;
    }

    function addMessage(text, sender, isError = false) {
      const group = document.createElement("div");
      group.className = "msg-group " + (sender === "user" ? "user-group" : "bot-group");

      const tag = document.createElement("div");
      tag.className = "msg-sender-tag";
      tag.textContent = sender === "user" ? "You" : "Cybrom AI";
      group.appendChild(tag);

      const div = document.createElement("div");
      div.className = "msg " + sender + (isError ? " error-msg" : "");
      if (sender === "bot" && !isError) {
        div.innerHTML = formatBotText(text);
      } else {
        div.textContent = text;
      }

      group.appendChild(div);
      messagesEl.appendChild(group);
      scrollToBottom();
      return div;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Displays course cards in a horizontally scrollable carousel
    function addCourseCards(courses) {
      if (!courses || courses.length === 0) return;

      const wrapper = document.createElement("div");
      wrapper.className = "carousel-wrapper";

      const hint = document.createElement("div");
      hint.className = "carousel-hint";
      hint.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 17 18 12 13 7"></polyline>
          <polyline points="6 17 11 12 6 7"></polyline>
        </svg>
        <span>Swipe horizontally to compare courses (${courses.length} options)</span>
      `;
      wrapper.appendChild(hint);

      const carousel = document.createElement("div");
      carousel.className = "course-carousel";

      courses.forEach(c => {
        const card = document.createElement("div");
        card.className = "course-card";
        card.setAttribute("role", "article");

        const modulesHtml = (c.modules_preview || [])
          .map(m => `<li>${m}</li>`)
          .join("");
        const hasMore = (c.total_modules || 0) > (c.modules_preview || []).length;

        card.innerHTML = `
          <div class="card-top">
            <span class="badge">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
              ${c.mode || "Online / Offline"}
            </span>
          </div>
          <h4>${c.title || ""}</h4>
          <div class="meta">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>
            Duration: ${c.duration || "Contact us"}
          </div>
          ${modulesHtml ? `<ul class="module-list">${modulesHtml}</ul>` : ""}
          ${hasMore ? `<div class="more-note">+ ${(c.total_modules - (c.modules_preview || []).length)} more syllabus modules</div>` : ""}
          <a href="${c.link || '#'}" class="primary-cta-btn" data-title="${c.title || ''}" target="_blank" rel="noopener">
            View Syllabus & Apply →
          </a>
        `;
        carousel.appendChild(card);

        const linkEl = card.querySelector(".primary-cta-btn");
        linkEl.addEventListener("click", () => {
          fetch(MARK_INTEREST_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId, course_title: c.title }),
            keepalive: true
          }).catch(err => console.warn("mark-interest failed:", err));
        });
      });

      wrapper.appendChild(carousel);
      messagesEl.appendChild(wrapper);
      scrollToBottom();
    }

    function addQuickReplies(options) {
      const wrap = document.createElement("div");
      wrap.className = "quick-replies";

      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = opt;
        btn.className = "qr-btn" + (opt === "Something else" || opt === "Still deciding" ? " ghost" : "");
        btn.addEventListener("click", () => {
          wrap.remove();
          if (opt === "Something else") {
            inputEl.focus();
            return;
          }
          addMessage(opt, "user");
          sendToBackend(opt);
        });
        wrap.appendChild(btn);
      });
      messagesEl.appendChild(wrap);
      scrollToBottom();
    }

    async function sendToBackend(text, retryCount = 0) {
      sendBtn.disabled = true;
      typingEl.classList.add("show");
      scrollToBottom();

      // Show waking up notice if request takes more than 4 seconds
      clearTimeout(wakeTimer);
      wakeTimer = setTimeout(() => {
        serverNotice.classList.add("show");
      }, 4000);

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 40000);

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        clearTimeout(wakeTimer);
        serverNotice.classList.remove("show");

        if (!res.ok) {
          throw new Error(`Server returned HTTP ${res.status}`);
        }

        const data = await res.json();
        addMessage(data.reply, "bot");

        // Dynamically drive the stepper from backend step
        if (typeof data.step === "number") {
          setStep(data.step);
        }

        if (data.suggested_courses && data.suggested_courses.length > 0) {
          addCourseCards(data.suggested_courses);
        }
        if (data.quick_replies && data.quick_replies.length > 0) {
          addQuickReplies(data.quick_replies);
        }
      } catch (err) {
        clearTimeout(timeoutId);
        clearTimeout(wakeTimer);
        serverNotice.classList.remove("show");
        console.error("Backend error:", err);

        const errorDiv = addMessage(
          "Cloud server wake-up is taking a little longer than usual. Tap below to retry connecting.",
          "bot",
          true
        );
        const retryBtn = document.createElement("button");
        retryBtn.className = "retry-btn";
        retryBtn.innerHTML = "🔄 Retry Connecting";
        retryBtn.onclick = () => {
          errorDiv.remove();
          sendToBackend(text, retryCount + 1);
        };
        errorDiv.appendChild(document.createElement("br"));
        errorDiv.appendChild(retryBtn);
      } finally {
        sendBtn.disabled = false;
        typingEl.classList.remove("show");
        inputEl.focus();
      }
    }

    // ========================================================
    // EASTER EGG PRANK: ROGUE ENTER BUTTON & HERO RESCUE AVATAR
    // ========================================================
    let prankCompleted = sessionStorage.getItem("cybrom_easter_egg_done") === "true";
    let prankIsRunning = false;
    let rogueDodgeCount = 0;
    let rogueTimer = null;
    let evasionMoveHandler = null;

    // Web Audio Synthesizer for high quality cartoon & retro arcade SFX
    let sfxAudioContext = null;
    function getSfxContext() {
      if (!sfxAudioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) sfxAudioContext = new AudioContextClass();
      }
      if (sfxAudioContext && sfxAudioContext.state === "suspended") {
        sfxAudioContext.resume().catch(() => {});
      }
      return sfxAudioContext;
    }

    function playBoingSfx() {
      try {
        const ctx = getSfxContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        const now = ctx.currentTime;
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(560, now + 0.22);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.26);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
      } catch (e) {}
    }

    function playLaserSfx() {
      try {
        const ctx = getSfxContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sawtooth";
        const now = ctx.currentTime;
        osc.frequency.setValueAtTime(1300, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.18);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      } catch (e) {}
    }

    function playExplosionSfx() {
      try {
        const ctx = getSfxContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        const now = ctx.currentTime;
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.25);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      } catch (e) {}
    }

    function playDingSfx() {
      try {
        const ctx = getSfxContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        const now = ctx.currentTime;
        osc.frequency.setValueAtTime(659.25, now);
        osc.frequency.setValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.38);
      } catch (e) {}
    }

    function showTauntBadge(x, y, text) {
      const widget = document.querySelector(".chat-widget");
      if (!widget) return;
      const badge = document.createElement("div");
      badge.className = "rogue-taunt";
      badge.textContent = text;
      badge.style.left = (x - 20) + "px";
      badge.style.top = (y - 25) + "px";
      widget.appendChild(badge);
      setTimeout(() => badge.remove(), 850);
    }

    function dodgeRogueButton() {
      const widget = document.querySelector(".chat-widget");
      if (!widget || !prankIsRunning) return;
      const rect = widget.getBoundingClientRect();
      const currentX = parseFloat(sendBtn.style.left) || (rect.width - 60);
      const currentY = parseFloat(sendBtn.style.top) || (rect.height - 60);

      // Random target inside widget avoiding edges
      const minX = 25;
      const maxX = rect.width - 70;
      const minY = 90;
      const maxY = rect.height - 120;

      let newX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
      let newY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

      if (Math.hypot(newX - currentX, newY - currentY) < 70) {
        newX = (newX + 120) % (maxX - minX) + minX;
        newY = (newY + 120) % (maxY - minY) + minY;
      }

      sendBtn.style.left = newX + "px";
      sendBtn.style.top = newY + "px";
      playBoingSfx();

      rogueDodgeCount++;
      const taunts = ["Nope! 😜", "Catch me! 🏃💨", "Too slow! ⚡", "Missed me! 🤪", "Hehe! 👻", "Can't touch this! 🕺"];
      showTauntBadge(currentX, currentY, taunts[rogueDodgeCount % taunts.length]);
    }

    function startRogueButtonPrank() {
      prankIsRunning = true;
      const widget = document.querySelector(".chat-widget");
      const chatForm = document.getElementById("chatForm");
      if (!widget || !chatForm) return;

      const widgetRect = widget.getBoundingClientRect();
      const btnRect = sendBtn.getBoundingClientRect();

      // Create ghost placeholder so input layout doesn't shift
      const ghost = document.createElement("div");
      ghost.className = "send-btn-ghost";
      ghost.id = "sendBtnGhost";
      chatForm.insertBefore(ghost, sendBtn);

      // Move sendBtn directly into chat-widget with absolute position
      widget.appendChild(sendBtn);
      sendBtn.classList.add("rogue-mode");

      const startX = btnRect.left - widgetRect.left;
      const startY = btnRect.top - widgetRect.top;
      sendBtn.style.left = startX + "px";
      sendBtn.style.top = startY + "px";

      setTimeout(() => {
        playBoingSfx();
        sendBtn.style.left = (widgetRect.width / 2 - 22) + "px";
        sendBtn.style.top = (widgetRect.height * 0.55) + "px";
        showTauntBadge(startX, startY, "Boing! 💨");
      }, 50);

      // Proximity cursor evasion
      evasionMoveHandler = function (e) {
        if (!prankIsRunning) return;
        const bRect = sendBtn.getBoundingClientRect();
        const btnCenterX = bRect.left + bRect.width / 2;
        const btnCenterY = bRect.top + bRect.height / 2;
        const dist = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);
        if (dist < 85) {
          dodgeRogueButton();
        }
      };
      widget.addEventListener("mousemove", evasionMoveHandler);

      sendBtn.onmouseenter = dodgeRogueButton;
      sendBtn.onclick = function (e) {
        if (prankIsRunning) {
          e.preventDefault();
          e.stopPropagation();
          dodgeRogueButton();
        }
      };

      // After 3.5 seconds, avatar peeks out from bottom right!
      rogueTimer = setTimeout(() => {
        if (prankIsRunning) {
          spawnPeekingHeroAvatar();
        }
      }, 3500);
    }

    function spawnPeekingHeroAvatar() {
      const widget = document.querySelector(".chat-widget");
      if (!widget || !prankIsRunning) return;

      const avatarWrap = document.createElement("div");
      avatarWrap.className = "hero-avatar-wrap peeking";
      avatarWrap.id = "heroAvatarWrap";
      avatarWrap.style.bottom = "12px";
      avatarWrap.style.right = "10px";

      avatarWrap.innerHTML = `
        <div class="avatar-bubble" id="avatarBubble">You want help? Click me! 🎯</div>
        <svg viewBox="0 0 64 80" width="64" height="80" fill="none">
          <g class="avatar-legs" id="avatarLegs">
            <rect x="20" y="52" width="7" height="18" rx="3.5" fill="#1E293B" />
            <ellipse cx="23.5" cy="71" rx="5.5" ry="3.5" fill="#0F172A" />
            <rect x="35" y="52" width="7" height="18" rx="3.5" fill="#1E293B" />
            <ellipse cx="38.5" cy="71" rx="5.5" ry="3.5" fill="#0F172A" />
          </g>
          <path d="M16 32 C16 28 22 26 32 26 C42 26 48 28 48 32 L46 54 C46 56 42 58 32 58 C22 58 18 56 18 54 Z" fill="url(#avatarCoatGrad)" />
          <path d="M26 26 L32 38 L38 26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
          <polygon points="32,38 30,46 32,48 34,46" fill="#F43F5E" />
          <circle cx="32" cy="18" r="13" fill="#FFE4E6" stroke="#CBD5E1" stroke-width="1.5" />
          <path d="M19 16 C20 9 27 6 34 7 C40 8 45 12 45 16 C42 12 36 10 30 11 C24 12 21 14 19 16 Z" fill="#0F172A" />
          <path d="M22 17 Q27 15 32 17 Q37 15 42 17 L41 21 Q37 23 32 20 Q27 23 23 21 Z" fill="#0284C7" stroke="#0F172A" stroke-width="1.5" />
          <line x1="24" y1="18" x2="29" y2="19" stroke="#E0F2FE" stroke-width="1.2" stroke-linecap="round" />
          <line x1="34" y1="18" x2="39" y2="19" stroke="#E0F2FE" stroke-width="1.2" stroke-linecap="round" />
          <path d="M28 25 Q32 28 36 25" stroke="#991B1B" stroke-width="1.5" stroke-linecap="round" />
          <g class="avatar-left-arm">
            <path d="M16 32 Q10 38 12 46" stroke="#4338CA" stroke-width="6" stroke-linecap="round" />
            <circle cx="12" cy="46" r="3.5" fill="#FFE4E6" />
          </g>
          <g class="avatar-gun-arm" id="avatarGunArm">
            <path d="M48 32 Q54 36 52 42" stroke="#4338CA" stroke-width="6" stroke-linecap="round" />
            <circle cx="52" cy="42" r="3.5" fill="#FFE4E6" />
            <g class="blaster-gun" id="blasterGun" opacity="0" transform="translate(48, 36)">
              <rect x="0" y="-3" width="16" height="6" rx="2" fill="#1E293B" />
              <rect x="5" y="2" width="4" height="7" rx="1.5" fill="#475569" />
              <rect x="13" y="-2" width="6" height="4" rx="1" fill="#0284C7" />
              <circle cx="19" cy="0" r="2.2" fill="#38BDF8" />
            </g>
          </g>
          <defs>
            <linearGradient id="avatarCoatGrad" x1="16" y1="26" x2="48" y2="58" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4F46E5" />
              <stop offset="1" stop-color="#3730A3" />
            </linearGradient>
          </defs>
        </svg>
      `;

      widget.appendChild(avatarWrap);

      avatarWrap.addEventListener("click", () => {
        executeHeroRescue(avatarWrap);
      }, { once: true });
    }

    function executeHeroRescue(avatarWrap) {
      const widget = document.querySelector(".chat-widget");
      const bubble = document.getElementById("avatarBubble");
      const blaster = document.getElementById("blasterGun");
      const gunArm = document.getElementById("avatarGunArm");
      if (!widget || !avatarWrap) return;

      if (bubble) bubble.textContent = "I got this! 🕶️💥";
      avatarWrap.classList.remove("peeking");
      avatarWrap.classList.add("walking");

      // Walk towards the action area
      avatarWrap.style.right = "auto";
      avatarWrap.style.left = "38px";
      avatarWrap.style.bottom = "68px";

      setTimeout(() => {
        avatarWrap.classList.remove("walking");
        if (bubble) bubble.textContent = "Freeze, rogue button! 🔫";

        // Pull out blaster
        if (blaster) blaster.setAttribute("opacity", "1");

        const aRect = avatarWrap.getBoundingClientRect();
        const bRect = sendBtn.getBoundingClientRect();
        const gunX = aRect.left + 52;
        const gunY = aRect.top + 42;
        const targetX = bRect.left + bRect.width / 2;
        const targetY = bRect.top + bRect.height / 2;
        const angleDeg = (Math.atan2(targetY - gunY, targetX - gunX) * 180) / Math.PI;

        if (gunArm) {
          gunArm.style.transform = `rotate(${angleDeg}deg)`;
        }

        setTimeout(() => {
          fireLaserShot(gunX, gunY, targetX, targetY, () => {
            knockOutRogueButton(avatarWrap);
          });
        }, 380);
      }, 1050);
    }

    function fireLaserShot(startX, startY, endX, endY, onImpact) {
      const widget = document.querySelector(".chat-widget");
      const wRect = widget.getBoundingClientRect();
      playLaserSfx();

      const bullet = document.createElement("div");
      bullet.className = "laser-bullet";

      const localStartX = startX - wRect.left;
      const localStartY = startY - wRect.top;
      const localEndX = endX - wRect.left;
      const localEndY = endY - wRect.top;

      const angle = Math.atan2(localEndY - localStartY, localEndX - localStartX);
      bullet.style.left = localStartX + "px";
      bullet.style.top = localStartY + "px";
      bullet.style.transform = `rotate(${angle}rad)`;
      widget.appendChild(bullet);

      setTimeout(() => {
        bullet.style.left = localEndX + "px";
        bullet.style.top = localEndY + "px";
      }, 20);

      setTimeout(() => {
        bullet.remove();
        onImpact();
      }, 200);
    }

    function knockOutRogueButton(avatarWrap) {
      const widget = document.querySelector(".chat-widget");
      const chatForm = document.getElementById("chatForm");
      const ghost = document.getElementById("sendBtnGhost");
      const bubble = document.getElementById("avatarBubble");
      const blaster = document.getElementById("blasterGun");
      const gunArm = document.getElementById("avatarGunArm");
      if (!widget || !sendBtn) return;

      if (evasionMoveHandler) {
        widget.removeEventListener("mousemove", evasionMoveHandler);
      }
      sendBtn.onmouseenter = null;
      sendBtn.onclick = null;

      playExplosionSfx();
      const bRect = sendBtn.getBoundingClientRect();
      const wRect = widget.getBoundingClientRect();
      const explosionX = bRect.left + bRect.width / 2 - wRect.left;
      const explosionY = bRect.top + bRect.height / 2 - wRect.top;

      const burst = document.createElement("div");
      burst.className = "impact-explosion";
      burst.textContent = "💥";
      burst.style.left = explosionX + "px";
      burst.style.top = explosionY + "px";
      widget.appendChild(burst);
      setTimeout(() => burst.remove(), 600);

      sendBtn.classList.remove("rogue-mode");
      sendBtn.classList.add("rogue-hit");

      const stars = document.createElement("div");
      stars.className = "dizzy-stars";
      stars.textContent = "💫";
      stars.style.left = explosionX + "px";
      stars.style.top = (explosionY - 24) + "px";
      widget.appendChild(stars);

      setTimeout(() => {
        stars.remove();
        if (ghost) {
          const gRect = ghost.getBoundingClientRect();
          const targetX = gRect.left - wRect.left;
          const targetY = gRect.top - wRect.top;
          sendBtn.style.transition = "all 0.45s cubic-bezier(0.25, 1, 0.5, 1)";
          sendBtn.style.left = targetX + "px";
          sendBtn.style.top = targetY + "px";
        }

        setTimeout(() => {
          playDingSfx();
          sendBtn.classList.remove("rogue-hit");
          sendBtn.style = "";
          if (ghost) {
            chatForm.replaceChild(sendBtn, ghost);
          }

          if (bubble) bubble.textContent = "All set! You can send now! 😎✌️";
          if (blaster) blaster.setAttribute("opacity", "0");
          if (gunArm) gunArm.style.transform = "rotate(0deg)";

          setTimeout(() => {
            if (avatarWrap) {
              avatarWrap.classList.add("walking");
              avatarWrap.style.left = (wRect.width + 80) + "px";
              avatarWrap.style.opacity = "0";
              setTimeout(() => avatarWrap.remove(), 1100);
            }

            prankIsRunning = false;
            prankCompleted = true;
            sessionStorage.setItem("cybrom_easter_egg_done", "true");
            inputEl.focus();
          }, 950);
        }, 480);
      }, 700);
    }

    function handleChatSubmit(e) {
      if (e) e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;

      // On the very first text entry, run the interactive rogue button easter egg prank!
      if (!prankCompleted && !prankIsRunning) {
        startRogueButtonPrank();
        return;
      }

      if (prankIsRunning) {
        return; // Don't allow submit while rescue sequence is happening
      }

      sendMessage();
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      addMessage(text, "user");
      inputEl.value = "";
      sendToBackend(text);
    }

    // Initial greeting
    addMessage("Hello! How can I assist you with your tech courses today?", "bot");
  </script>

</body>
